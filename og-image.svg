<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&amp;family=DM+Mono:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#eef4fb"/>

  <!-- Grid lines -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="630" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="630" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="rgba(13,31,56,0.06)" stroke-width="1"/>

  <!-- Dark left panel -->
  <rect x="0" y="0" width="380" height="630" fill="#0d1f38"/>

  <!-- Gold divider -->
  <line x1="380" y1="0" x2="380" y2="630" stroke="#b8860b" stroke-width="2"/>

  <!-- Logo (inverted in dark panel) -->
  <image href="data:image/jpeg;base64," x="110" y="80" width="160" height="160" style="filter: invert(1) brightness(2);"/>

  <!-- Left panel: site name -->
  <text x="110" y="300" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#eef4fb">1love.works</text>
  <text x="110" y="326" font-family="monospace" font-size="11" letter-spacing="1" fill="#b8860b">DE LEGE ET AMORE</text>

  <!-- Right panel content -->

  <!-- Tradition → Innovation -->
  <text x="440" y="78" font-family="monospace" font-size="11" letter-spacing="2" fill="#b8860b">TRADITION  →  INNOVATION</text>

  <!-- Main title -->
  <text x="440" y="140" font-family="Georgia, serif" font-size="52" font-weight="400" fill="#0d1f38">The Legal System Meter</text>
  <text x="440" y="182" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#2a7fc0">in phenography©</text>

  <!-- Equation -->
  <text x="440" y="232" font-family="monospace" font-size="14" letter-spacing="1" fill="#2a7fc0">E = MC²  →  Λ = C²  →  Λ = E / M</text>
  <text x="440" y="252" font-family="monospace" font-size="11" fill="#5a7490">(JLMI 2/25)</text>

  <!-- Divider -->
  <line x1="440" y1="278" x2="1150" y2="278" stroke="rgba(13,31,56,0.12)" stroke-width="1"/>

  <!-- Stats row -->
  <!-- Entropy -->
  <text x="440" y="302" font-family="monospace" font-size="10" letter-spacing="1" fill="#5a7490">TOTAL ENTROPY (ΣS)</text>
  <text x="440" y="328" font-family="Georgia, serif" font-size="26" font-weight="500" fill="#8b0000">1,557</text>

  <!-- PNC circulation -->
  <text x="680" y="302" font-family="monospace" font-size="10" letter-spacing="1" fill="#5a7490">⬡ PNC IN CIRCULATION</text>
  <text x="680" y="328" font-family="Georgia, serif" font-size="26" font-weight="500" fill="#0d1f38">10,101</text>

  <!-- PNC value -->
  <rect x="920" y="278" width="230" height="70" fill="#ddeaf8"/>
  <line x1="920" y1="278" x2="920" y2="348" stroke="#b8860b" stroke-width="2"/>
  <text x="934" y="302" font-family="monospace" font-size="10" letter-spacing="1" fill="#5a7490">⬡ PNC VALUE</text>
  <text x="934" y="328" font-family="Georgia, serif" font-size="26" font-weight="500" fill="#b8860b">€253</text>

  <!-- Bottom divider -->
  <line x1="440" y1="368" x2="1150" y2="368" stroke="rgba(13,31,56,0.08)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="440" y="394" font-family="monospace" font-size="11" fill="#5a7490">A technological framework to measure legal entropy and weight in</text>
  <text x="440" y="412" font-family="monospace" font-size="11" fill="#5a7490">and optimise European legal systems.</text>

  <!-- URL bottom -->
  <text x="440" y="590" font-family="monospace" font-size="13" letter-spacing="1" fill="#0d1f38">1love.works</text>
</svg>
